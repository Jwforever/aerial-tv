name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standard-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standard release
        run: ./gradlew assembleStandardRelease --console=plain

      - name: Read versionName
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename APK to what tools/install.sh downloads
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/aerial-standard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Aerial ${{ steps.version.outputs.version }}
          body: |
            Built from ${{ github.sha }}.

            This APK is signed with the runner's debug key, because
            local/signing.properties is not in the repository. It installs
            fresh, but it cannot update an install signed with the real key.
          files: dist/aerial-standard.apk
          fail_on_unmatched_files: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerial-standard-release
          path: dist/aerial-standard.apk
          retention-days: 14
