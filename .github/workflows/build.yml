name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local/signing.properties is not versioned, so this APK is signed with the
      # runner's generated debug key: installable fresh, but it cannot update an
      # existing install that was signed with the real key.
      - name: Build standard release
        run: ./gradlew assembleStandardRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerial-standard-release
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 14
