name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.2 (creates the v1.0.2 tag)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  standard-release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - name: Require the signing secrets
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Add SIGNING_KEY, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts reads local/signing.properties and falls back to a debug
      # key when it is missing, so the release key has to exist before the build.
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p local
          printf '%s' "$SIGNING_KEY" | base64 -d > local/aerial-release.jks
          {
            echo "storeFile=aerial-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local/signing.properties

      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.0.2 or 1.0.2-file.1"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${version%%-*}"
          patch="${patch:-0}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Build standard release
        run: >-
          ./gradlew assembleStandardRelease --console=plain
          -PversionName="${{ steps.version.outputs.name }}"
          -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK to what tools/install.sh downloads
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/aerial-standard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Aerial ${{ steps.version.outputs.name }}
          body: |
            Built from ${{ github.sha }}.
            versionName ${{ steps.version.outputs.name }}, versionCode ${{ steps.version.outputs.code }}.
          files: dist/aerial-standard.apk
          fail_on_unmatched_files: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerial-standard-release
          path: dist/aerial-standard.apk
          retention-days: 14
